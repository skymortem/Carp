<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0e1116">
    <title>{% block title %}Carp{% endblock %}</title>
    <!-- «Добавить на экран Домой» в Safari: standalone-режим без адресной строки -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Carp">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script>
        // Палитра «Графит»: нейтрали переопределены на холодный графит,
        // акцент — один синий. Классы в шаблонах остаются прежними,
        // поэтому разметку при смене палитры трогать не нужно.
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            100: '#e7eaf0', 200: '#c8cfd9', 300: '#b6bfcc', 400: '#8b94a3',
                            500: '#6f7a88', 600: '#566170', 700: '#333c48',
                            800: '#232a34', 900: '#161b22',
                        },
                        blue: { 300: '#a9c6ff', 400: '#8db4ff', 500: '#4f8cff', 600: '#3c78e8', 700: '#2f62c9' },
                        red: { 300: '#ff9d95', 400: '#ff7b72', 500: '#e5534b', 700: '#8c3a3a', 900: '#3a1c1c' },
                        green: { 400: '#6fd39a', 500: '#2f9e5e' },
                        amber: { 400: '#e8b34b' },
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg: #0e1116;
            --surface: #151a21;
            --raised: #1b212a;
            --line: #232a34;
            --ink: #e7eaf0;
            --muted: #8b94a3;
            --accent: #4f8cff;
            --accent-hover: #3c78e8;
        }
        body {
            background: var(--bg); color: var(--ink);
            /* standalone на iPhone: не залезать под «чёлку» и home-бар */
            padding-top: 0;
            padding-top: env(safe-area-inset-top);
            padding-bottom: 0;
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: 0;
            padding-left: env(safe-area-inset-left);
            padding-right: 0;
            padding-right: env(safe-area-inset-right);
        }
        .card { background: var(--surface); border: 1px solid var(--line); border-radius: 0.625rem; }
        .btn-primary {
            background: var(--accent); color: #fff; padding: 0.5rem 1rem;
            border-radius: 0.5rem; font-weight: 600; transition: background-color .15s ease;
        }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-secondary { background: var(--raised); color: var(--ink); padding: 0.5rem 1rem; border-radius: 0.5rem; }
        .btn-secondary:hover { background: #222a35; }
        .btn-primary:focus-visible, .btn-secondary:focus-visible, .input:focus-visible {
            outline: 2px solid var(--accent); outline-offset: 2px;
        }
        .input {
            background: var(--bg); border: 1px solid var(--line); border-radius: 0.5rem;
            padding: 0.5rem 0.75rem; color: var(--ink); width: 100%;
        }
        .input:focus { outline: none; border-color: var(--accent); }
        .badge { padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
    </style>
</head>
<body class="min-h-screen">
    <nav class="border-b border-slate-700/50 px-6 py-3 flex items-center justify-between gap-3">
        <a href="/" class="text-xl font-bold text-blue-400 shrink-0">🚗 Carp</a>
        <div class="flex items-center gap-4 text-sm overflow-x-auto whitespace-nowrap min-w-0">
            {% if user %}
                <span class="text-slate-400">{{ user.username }}</span>
                <a href="/dashboard" class="text-slate-300 hover:text-white">Дашборд</a>
                <a href="/service-plan/page" class="text-slate-300 hover:text-white">План ТО</a>
                <a href="/starline-console" class="text-slate-300 hover:text-white">API</a>
                <a href="/setup" class="text-slate-300 hover:text-white">Настройки</a>
                <button hx-post="/auth/logout" hx-target="body" hx-push-url="/" class="text-red-400 hover:text-red-300">Выйти</button>
            {% else %}
                <a href="/login" class="text-slate-300 hover:text-white">Войти</a>
                {% if not owner_exists %}
                <a href="/register" class="btn-primary text-sm">Регистрация</a>
                {% endif %}
            {% endif %}
        </div>
    </nav>
    <main class="container mx-auto px-4 py-8 max-w-6xl">
        {% block content %}{% endblock %}
    </main>

    <script>
        // Глобальный обработчик ошибок HTMX
        document.body.addEventListener('htmx:responseError', function(evt) {
            const detail = evt.detail;
            if (detail.xhr.status === 401) {
                window.location.href = '/login';
            }
        });

        // Service worker: мгновенная статика и понятная заглушка без сети.
        // Регистрация не критична — при любой ошибке приложение работает как обычно.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js').catch(function() {});
            });
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
