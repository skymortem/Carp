<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>Нет связи — Carp</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0e1116; color: #e7eaf0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    display: grid; place-items: center; padding: 24px;
    text-align: center; -webkit-font-smoothing: antialiased;
  }
  .card {
    max-width: 320px; padding: 28px 24px;
    background: #151a21; border: 1px solid #232a34; border-radius: 14px;
  }
  h1 { font-size: 18px; margin: 0 0 8px; font-weight: 600; }
  p { margin: 0 0 18px; font-size: 14px; line-height: 1.5; color: #8b94a3; }
  button {
    font: inherit; font-size: 14px; font-weight: 600;
    background: #4f8cff; color: #fff; border: 0; border-radius: 8px;
    padding: 10px 18px; min-height: 44px; cursor: pointer;
  }
  button:hover { background: #3c78e8; }
</style>
</head>
<body>
  <div class="card">
    <h1>Нет связи с сервером</h1>
    <p>Carp показывает только живые данные машины, поэтому без сети показать нечего. Проверь соединение и попробуй снова.</p>
    <button onclick="location.reload()">Обновить</button>
  </div>
</body>
</html>
