# Alembic. URL не хранится здесь: его задаёт app/migrations.py во время старта,
# чтобы не дублировать секреты и не читать .env дважды.
#
# batch-режим (обязательный для SQLite при ALTER/DROP COLUMN) включён
# в alembic/env.py через render_as_batch=True.
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# CLI:
#   cd backend && alembic revision --autogenerate -m "..."   # новая миграция
#   cd backend && alembic upgrade head                        # применить
# Требуется DATABASE_URL (или -x sqlalchemy.url=...).
